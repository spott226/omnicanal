services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexoia
      POSTGRES_USER: nexoia
      POSTGRES_PASSWORD: nexoia
    ports: ["5432:5432"]
    volumes: ["nexoia_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoia -d nexoia"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["nexoia_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nexoia_postgres:
  nexoia_redis:
